name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy regex pytest

      - name: Syntax-check all sources
        run: python -m compileall -q src tests

      # Dequant + tokenizer tests run on CPU. The fused Triton kernel tests
      # (tests/test_kernels.py) and the GGUF integration test need a CUDA GPU /
      # model file, so they run locally (pytest tests/ -q on the RTX 5070).
      - name: Run CPU-safe tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests/test_dequant.py tests/test_tokenizer.py -q
